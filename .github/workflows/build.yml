name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Stamp the tag version into the binary and attest the artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bw-ssh-agent-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: bw-ssh-agent-linux-aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set app version from release tag
        if: inputs.release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not map to a valid Cargo version."
            exit 1
          fi
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" crates/cli/Cargo.toml
          # Only the workspace package's own version changes; dependencies stay pinned.
          cargo update --workspace --offline

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p bw-ssh-agent

      - name: Prepare release binary
        run: cp "target/${{ matrix.target }}/release/bw-ssh-agent" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Generate artifact attestation
        if: inputs.release
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifact_name }}
