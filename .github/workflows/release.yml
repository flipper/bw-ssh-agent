name: Release
run-name: "Release: ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      release: true
    permissions:
      contents: read
      id-token: write
      attestations: write

  package-plugin:
    name: Sign mise plugin (packslip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Package plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^PLUGIN.version = \".*\"/PLUGIN.version = \"$version\"/" metadata.lua
          grep -q "^PLUGIN.version = \"$version\"" metadata.lua
          mkdir -p dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - metadata.lua hooks LICENSE | gzip -n > dist/bw-ssh-agent-plugin.tar.gz
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign packslip manifest
        uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
        with:
          artifacts: dist/bw-ssh-agent-plugin.tar.gz
          manifest: packslip.toml
          version: ${{ steps.package.outputs.version }}
          tag: ${{ github.ref_name }}
          out: dist
          upload: "false"

      - name: Upload plugin release files
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build, package-plugin]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Package vfox plugin
        run: |
          mkdir -p release-assets
          zip -r release-assets/bw-ssh-agent.zip metadata.lua hooks

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release with all assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            release-assets/bw-ssh-agent-linux-x86_64
            release-assets/bw-ssh-agent-linux-aarch64
            release-assets/bw-ssh-agent.zip
            release-assets/bw-ssh-agent-plugin.tar.gz
            release-assets/packslip.sigstore.json
          fail_on_unmatched_files: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
