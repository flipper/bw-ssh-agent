name: Build and Release Pipeline
run-name: "${{ startsWith(github.ref, 'refs/tags/v') && format('Release: {0}', github.ref_name) || format('Build: {0}', github.ref_name) }}"

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bw-ssh-agent-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/bw-ssh-agent
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: bw-ssh-agent-linux-aarch64
            binary_path: target/aarch64-unknown-linux-gnu/release/bw-ssh-agent

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not map to a valid Cargo version."
            exit 1
          fi
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" crates/cli/Cargo.toml

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p bw-ssh-agent

      - name: Prepare release binary
        shell: bash
        run: |
          cp "${{ matrix.binary_path }}" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Package vfox plugin
        shell: bash
        run: |
          mkdir -p release-assets
          zip -r release-assets/bw-ssh-agent.zip metadata.lua hooks

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release with all artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/bw-ssh-agent-linux-x86_64
            release-assets/bw-ssh-agent-linux-aarch64
            release-assets/bw-ssh-agent.zip

  package-plugin:
    name: Sign mise plugin (packslip)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Package plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^PLUGIN.version = \".*\"/PLUGIN.version = \"$version\"/" metadata.lua
          grep -q "^PLUGIN.version = \"$version\"" metadata.lua
          mkdir -p dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - metadata.lua hooks LICENSE | gzip -n > dist/bw-ssh-agent-plugin.tar.gz
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign packslip manifest
        uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
        with:
          artifacts: dist/bw-ssh-agent-plugin.tar.gz
          manifest: packslip.toml
          version: ${{ steps.package.outputs.version }}
          tag: ${{ github.ref_name }}
          out: dist
          upload: "false"

      - name: Upload plugin release files
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: dist/
          if-no-files-found: error

  publish-plugin:
    name: Publish mise plugin
    runs-on: ubuntu-latest
    needs: [release, package-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download plugin release files
        uses: actions/download-artifact@v7
        with:
          name: plugin-release
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/bw-ssh-agent-plugin.tar.gz dist/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY"
