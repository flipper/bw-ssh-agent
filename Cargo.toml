[workspace]
members = [
    "crates/bitwarden_client",
    "crates/cli",
    "crates/common",
    "crates/gui", "crates/secret-store",
]

resolver = "3"

[workspace.dependencies]
log = "0.4.29"
simple_logger = "5.2.0"
anyhow = "1.0.102"
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[profile.release]
opt-level = "z"        # Optimize for size ("s" is also possible, but "z" is smaller)
lto = true             # Enable Link Time Optimization
codegen-units = 1      # Better optimization across the crate
panic = "abort"        # Removes unwinding code
strip = true           # Strip debug symbols
incremental = false    # Smaller binaries, more deterministic builds
